name: summary
on:
  push:
jobs:
  daily-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Create pull request
        uses: devops-infra/action-pull-request@v1.0.2
        with:
          template: .github/PULL_REQUEST_TEMPLATE.md
          get_diff: true